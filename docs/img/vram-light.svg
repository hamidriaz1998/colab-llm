<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="960" height="590" role="img" aria-labelledby="title desc"><title id="title">How much context fits on a T4</title><desc id="desc">Line chart of GPU memory against context size for each model and KV cache type, with the 15 GiB T4 limit. 9b f16 uses 13.4 GiB at 256K; 14b f16 reaches 14.5 GiB at 40K.</desc><style>
text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-variant-numeric: tabular-nums; }
.t1 { font-size: 22px; font-weight: 650; fill: #0b0b0b; letter-spacing: -0.01em; }
.t2 { font-size: 14px; fill: #52514e; }
.ax { font-size: 13px; fill: #898781; }
.lb { font-size: 13px; fill: #52514e; }
.lbb { font-size: 13px; fill: #0b0b0b; font-weight: 600; }
.big { font-size: 40px; font-weight: 650; fill: #0b0b0b; letter-spacing: -0.02em; font-variant-numeric: normal; }
.fn { font-size: 12px; fill: #898781; }
.draw { stroke-dasharray: 1; animation: draw 1.6s cubic-bezier(.22,.61,.36,1) both; }
.pop { transform-box: fill-box; transform-origin: center; animation: pop .45s cubic-bezier(.34,1.56,.64,1) both; }
.fade { animation: fade .7s ease-out both; }
.grow { transform-box: fill-box; transform-origin: left center; animation: grow 1s cubic-bezier(.22,.61,.36,1) both; }
@keyframes draw { from { stroke-dashoffset: 1; } }
@keyframes pop { from { opacity: 0; transform: scale(.3); } }
@keyframes fade { from { opacity: 0; } }
@keyframes grow { from { transform: scaleX(0); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style><rect x="0.5" y="0.5" width="959" height="589" rx="16" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/><text x="40.0" y="52.0" class="t1" text-anchor="start" >How much context fits on a T4</text><text x="40.0" y="78.0" class="t2" text-anchor="start" >Qwen3.5's hybrid attention keeps the 9b cache small enough for its full 256K context.</text><rect x="72" y="147.4" width="718" height="34.7" fill="#d03b3b" opacity=".08"/><line x1="72" x2="790" y1="460.0" y2="460.0" stroke="#e1e0d9"/><text x="58.0" y="464.5" class="ax" text-anchor="end" >6</text><line x1="72" x2="790" y1="390.5" y2="390.5" stroke="#e1e0d9"/><text x="58.0" y="395.0" class="ax" text-anchor="end" >8</text><line x1="72" x2="790" y1="321.1" y2="321.1" stroke="#e1e0d9"/><text x="58.0" y="325.6" class="ax" text-anchor="end" >10</text><line x1="72" x2="790" y1="251.6" y2="251.6" stroke="#e1e0d9"/><text x="58.0" y="256.1" class="ax" text-anchor="end" >12</text><line x1="72" x2="790" y1="182.1" y2="182.1" stroke="#e1e0d9"/><text x="58.0" y="186.6" class="ax" text-anchor="end" >14</text><line x1="72" x2="790" y1="147.4" y2="147.4" stroke="#d03b3b" stroke-width="1.5"/><text x="790.0" y="139.4" class="lbb" text-anchor="end" >T4 limit · 15 GiB</text><text x="790.0" y="174.1" class="fn" text-anchor="end" >keep 1 GiB free</text><text x="40.0" y="110.0" class="ax" text-anchor="start" >GiB used</text><text x="72.0" y="486.0" class="ax" text-anchor="middle" >16K</text><text x="244.0" y="486.0" class="ax" text-anchor="middle" >32K</text><text x="416.0" y="486.0" class="ax" text-anchor="middle" >64K</text><text x="588.0" y="486.0" class="ax" text-anchor="middle" >128K</text><text x="760.0" y="486.0" class="ax" text-anchor="middle" >256K</text><text x="416.0" y="512.0" class="ax" text-anchor="middle" >Context size (log scale)</text><path d="M416.0,418.9 C473.3,395.0 530.7,380.0 588.0,347.2 C624.9,326.1 661.8,298.9 698.7,266.6 C719.2,248.7 739.6,224.8 760.0,203.9" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-linecap="round" pathLength="1" class="draw" style="animation-delay:0.0s"/><circle cx="416.0" cy="418.9" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2" class="pop" style="animation-delay:0.30s"/><circle cx="588.0" cy="347.2" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2" class="pop" style="animation-delay:0.48s"/><circle cx="698.7" cy="266.6" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2" class="pop" style="animation-delay:0.66s"/><circle cx="760.0" cy="203.9" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2" class="pop" style="animation-delay:0.84s"/><circle cx="760.0" cy="203.9" r="11" fill="none" stroke="#0b0b0b" stroke-width="1.5" class="pop" style="animation-delay:2.1s"/><g class="fade" style="animation-delay:1.30s"><text x="776.0" y="208.9" class="lbb" text-anchor="start" >9b · f16</text><text x="776.0" y="225.9" class="lb" text-anchor="start" >13.4 GiB</text></g><path d="M416.0,444.1 C473.3,428.2 530.7,418.2 588.0,396.3 C624.9,382.2 661.8,364.1 698.7,342.6 C719.2,330.7 739.6,314.7 760.0,300.8" fill="none" stroke="#eb6834" stroke-width="2.5" stroke-linecap="round" pathLength="1" class="draw" style="animation-delay:0.2s"/><circle cx="416.0" cy="444.1" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2" class="pop" style="animation-delay:0.50s"/><circle cx="588.0" cy="396.3" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2" class="pop" style="animation-delay:0.68s"/><circle cx="698.7" cy="342.6" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2" class="pop" style="animation-delay:0.86s"/><circle cx="760.0" cy="300.8" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2" class="pop" style="animation-delay:1.04s"/><g class="fade" style="animation-delay:1.50s"><text x="776.0" y="305.8" class="lbb" text-anchor="start" >9b · q8_0</text><text x="776.0" y="322.8" class="lb" text-anchor="start" >10.6 GiB</text></g><path d="M72.0,295.0 C129.3,265.9 186.7,244.8 244.0,207.6 C262.5,195.7 280.9,178.5 299.4,164.0" fill="none" stroke="#1b