<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" role="img" aria-labelledby="title desc"><title id="title">SSH tunnel vs Cloudflare quick tunnel</title><desc id="desc">Bar chart of latency for the SSH and Cloudflare tunnels. Time to first token is 571 ms over SSH and 976 ms over Cloudflare.</desc><style>
text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-variant-numeric: tabular-nums; }
.t1 { font-size: 22px; font-weight: 650; fill: #f0efec; letter-spacing: -0.01em; }
.t2 { font-size: 14px; fill: #c3c2b7; }
.ax { font-size: 13px; fill: #898781; }
.lb { font-size: 13px; fill: #c3c2b7; }
.lbb { font-size: 13px; fill: #f0efec; font-weight: 600; }
.big { font-size: 40px; font-weight: 650; fill: #f0efec; letter-spacing: -0.02em; font-variant-numeric: normal; }
.fn { font-size: 12px; fill: #898781; }
.draw { stroke-dasharray: 1; animation: draw 1.6s cubic-bezier(.22,.61,.36,1) both; }
.pop { transform-box: fill-box; transform-origin: center; animation: pop .45s cubic-bezier(.34,1.56,.64,1) both; }
.fade { animation: fade .7s ease-out both; }
.grow { transform-box: fill-box; transform-origin: left center; animation: grow 1s cubic-bezier(.22,.61,.36,1) both; }
@keyframes draw { from { stroke-dashoffset: 1; } }
@keyframes pop { from { opacity: 0; transform: scale(.3); } }
@keyframes fade { from { opacity: 0; } }
@keyframes grow { from { transform: scaleX(0); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style><rect x="0.5" y="0.5" width="959" height="489" rx="16" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/><text x="40.0" y="52.0" class="t1" text-anchor="start" >SSH tunnel vs Cloudflare quick tunnel</text><text x="40.0" y="78.0" class="t2" text-anchor="start" >Shorter is better. The SSH tunnel is faster, private, and keeps one URL.</text><line x1="300.0" x2="300.0" y1="142" y2="364" stroke="#383835"/><text x="300.0" y="386.0" class="ax" text-anchor="middle" >0</text><line x1="385.0" x2="385.0" y1="142" y2="364" stroke="#2c2c2a"/><text x="385.0" y="386.0" class="ax" text-anchor="middle" >250 ms</text><line x1="470.0" x2="470.0" y1="142" y2="364" stroke="#2c2c2a"/><text x="470.0" y="386.0" class="ax" text-anchor="middle" >500 ms</text><line x1="555.0" x2="555.0" y1="142" y2="364" stroke="#2c2c2a"/><text x="555.0" y="386.0" class="ax" text-anchor="middle" >750 ms</text><line x1="640.0" x2="640.0" y1="142" y2="364" stroke="#2c2c2a"/><text x="640.0" y="386.0" class="ax" text-anchor="middle" >1000 ms</text><text x="280.0" y="178.0" class="lbb" text-anchor="end" >Time to first token</text><path d="M300,156 h190.2 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-190.2 Z" fill="#3987e5" class="grow" style="animation-delay:0.00s"/><g class="fade" style="animation-delay:0.80s"><text x="504.2" y="169.5" class="lbb" text-anchor="start" >571 ms</text></g><path d="M300,180 h328.0 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-328.0 Z" fill="#55544f" class="grow" style="animation-delay:0.08s"/><g class="fade" style="animation-delay:0.80s"><text x="642.0" y="193.5" class="lb" text-anchor="start" >976 ms</text></g><text x="280.0" y="252.0" class="lbb" text-anchor="end" >Health check, new connection</text><path d="M300,230 h169.7 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-169.7 Z" fill="#3987e5" class="grow" style="animation-delay:0.15s"/><g class="fade" style="animation-delay:0.95s"><text x="483.7" y="243.5" class="lbb" text-anchor="start" >511 ms</text></g><path d="M300,254 h267.6 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-267.6 Z" fill="#55544f" class="grow" style="animation-delay:0.23s"/><g class="fade" style="animation-delay:0.95s"><text x="581.6" y="267.5" class="lb" text-anchor="start" >799 ms</text></g><text x="280.0" y="326.0" class="lbb" text-anchor="end" >Health check, kept-alive</text><path d="M300,304 h83.6 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-83.6 Z" fill="#3987e5" class="grow" style="animation-delay:0.30s"/><g class="fade" style="animation-delay:1.10s"><text x="397.6" y="317.5" class="lbb" text-anchor="start" >258 ms</text></g><path d="M300,328 h97.8 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-97.8 Z" fill="#55544f" class="grow" style="animation-delay:0.38s"/><g class="fade" style="animation-delay:1.10s"><text x="411.8" y="341.5" class="lb" text-anchor="start" >299 ms</text></g><rect x="300" y="106" width="12" height="12" rx="3" fill="#3987e5"/><text x="318.0" y="116.0" class="lb" text-anchor="start" >SSH tunnel (default)</text><rect x="470" y="106" width="12" height="12" rx="3" fill="#55544f"/><text x="488.0" y="116.0" class="lb" text-anchor="start" >Cloudflare quick tunnel</text><g class="fade" style="animation-delay:1.10s"><rect x="728" y="152" width="192" height="100" rx="12" fill="none" stroke="rgba(255,255,255,0.10)"/><text x="744.0" y="178.0" class="lb" text-anchor="start" >Reconnect after a drop</text><text x="744.0" y="218.0" class="big" text-anchor="start" >3.6 s</text><text x="744.0" y="240.0" class="fn" text-anchor="start" >vs ~15 s and a new URL</text></g><g class="fade" style="animation-delay:1.30s"><rect x="728" y="270" width="192" height="100" rx="12" fill="none" stroke="rgba(255,255,255,0.10)"/><text x="744.0" y="296.0" class="lb" text-anchor="start" >Request time limit</text><text x="744.0" y="336.0" class="big" text-anchor="start" >None</text><text x="744.0" y="358.0" class="fn" text-anchor="start" >vs 100 s with no reply bytes</text></g><text x="40.0" y="462.0" class="fn" text-anchor="start" >Median of 20 interleaved rounds (8 for time to first token) against the same Colab VM.</text></svg>