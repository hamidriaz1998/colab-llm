<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="title desc"><title id="title">It finds a fact anywhere in a 200K-token prompt</title><desc id="desc">Grid of needle-in-a-haystack results: 6 of 6 tests passed at 32K, 128K and 200K tokens.</desc><style>
text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-variant-numeric: tabular-nums; }
.t1 { font-size: 22px; font-weight: 650; fill: #f0efec; letter-spacing: -0.01em; }
.t2 { font-size: 14px; fill: #c3c2b7; }
.ax { font-size: 13px; fill: #898781; }
.lb { font-size: 13px; fill: #c3c2b7; }
.lbb { font-size: 13px; fill: #f0efec; font-weight: 600; }
.big { font-size: 40px; font-weight: 650; fill: #f0efec; letter-spacing: -0.02em; font-variant-numeric: normal; }
.fn { font-size: 12px; fill: #898781; }
.draw { stroke-dasharray: 1; animation: draw 1.6s cubic-bezier(.22,.61,.36,1) both; }
.pop { transform-box: fill-box; transform-origin: center; animation: pop .45s cubic-bezier(.34,1.56,.64,1) both; }
.fade { animation: fade .7s ease-out both; }
.grow { transform-box: fill-box; transform-origin: left center; animation: grow 1s cubic-bezier(.22,.61,.36,1) both; }
@keyframes draw { from { stroke-dashoffset: 1; } }
@keyframes pop { from { opacity: 0; transform: scale(.3); } }
@keyframes fade { from { opacity: 0; } }
@keyframes grow { from { transform: scaleX(0); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
